[project]
name = "spiketrandvg"
version = "0.1.0"
description = "Spiking transformer for language-driven object grounding on event streams (Talk2Event)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "rapidfuzz>=3.14.5",
    # E-3DSNN's sparse 3D convolutions; the cu126 build is the one with cp312 wheels
    # and it runs on sm_120 (RTX 5090). Needed by models/e3dsnn_event_encoder.py.
    "spconv-cu126>=2.3.8",
    "spikingjelly>=0.0.0.0.14",
    "timm>=1.0.28",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=4.30,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spiketrandvg"]
